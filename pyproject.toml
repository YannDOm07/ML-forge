[project]
name = "mlforge"
version = "1.0.0"
description = "Laboratoire local et traçable pour compétitions de machine learning"
requires-python = ">=3.12"
# Versions fixées : sous Windows, Smart App Control bloque des modules compilés trop récents
# (« An Application Control policy has blocked this file »). Celles-ci se chargent sur le PC cible.
dependencies = [
    "numpy==2.5.2",
    "scipy==1.16.3",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
