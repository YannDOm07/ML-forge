name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mlforge:ci .
      - run: docker run --rm mlforge:ci test
      - name: Démonstration et persistance du volume
        run: |
          docker volume create mlforge-ci
          docker run --rm -v mlforge-ci:/data mlforge:ci demo
          docker run --rm -v mlforge-ci:/data mlforge:ci list | grep -q "Démo synthétique"
